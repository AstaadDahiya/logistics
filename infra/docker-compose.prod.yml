# =============================================================================
# Logistics Platform — Production GCE Deployment
#
# All services run together on a single VM. No profiles needed.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: logistics-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://34.173.18.253:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: logistics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  flink-job:
    build:
      context: ../
      dockerfile: infra/flink/Dockerfile
    container_name: logistics-flink-collision
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TELEMETRY_TOPIC: shipment-telemetry
      THREAT_TOPIC: threat-signals
      ANOMALY_ALERTS_TOPIC: anomaly-alerts
      WATERMARK_TOLERANCE_MS: "120000"
      THREAT_TTL_S: "600"
      FLINK_TELEMETRY_GROUP_ID: flink-collision-telemetry
      FLINK_THREAT_GROUP_ID: flink-collision-threats
    volumes:
      - ../services/prediction/flink_job/collision_job.py:/app/collision_job.py:ro
      - ../services/prediction/flink_job/geometry.py:/app/geometry.py:ro
    restart: always

  llm-service:
    build:
      context: ../services/llm-service
      dockerfile: Dockerfile
    container_name: logistics-llm-optimization
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
      GCP_PROJECT: logistics-493715
      GCP_LOCATION: us-central1
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-key.json
    ports:
      - "8080:8080"
    restart: always

  bridge:
    build:
      context: ../services/bridge
    container_name: logistics-bridge
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
      LLM_SERVICE_URL: http://logistics-llm-optimization:8080
      PORT: "3001"
    ports:
      - "3001:3001"
    restart: always

  context-assembly:
    build:
      context: ../
      dockerfile: infra/context_assembly/Dockerfile
    container_name: logistics-context-assembly
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
      ANOMALY_ALERTS_TOPIC: anomaly-alerts
      OPTIMIZATION_REQUESTS_TOPIC: optimization-requests
    restart: always

volumes:
  redpanda_data:
    driver: local
  redis_data:
    driver: local
